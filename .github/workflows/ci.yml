name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage (fails below 90%)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  vulnerability-scan:
    name: OSS vulnerability scan (fails on CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Informational: list HIGH findings in the log without failing the build.
      - name: Trivy scan (HIGH, report only)
        uses: aquasecurity/trivy-action@master #
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH
          exit-code: "0"
          ignore-unfixed: true
          format: table

      # Gate: any CRITICAL vulnerability fails the build.
      - name: Trivy scan (CRITICAL, fails the build)
        uses: aquasecurity/trivy-action@master #
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  # docker-build:
  #   name: Docker build
  #   needs: [test, vulnerability-scan]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build image
  #       run: docker build -t trade-store:${{ github.sha }} .
  docker-build:
    name: Docker build
    needs: [test, vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Generate a timestamp and store it as an environment variable
      - name: Generate timestamp
        id: time
        run: echo "TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

      # 2. Build the Docker image
      - name: Build image
        run: docker build -t trade-store:${{ github.sha }} .

      # 3. Create the directory and save the image as a .tar file
      - name: Save Docker image to folder
        run: |
          mkdir -p docker-builds
          docker save trade-store:${{ github.sha }} -o docker-builds/trade-store_${{ env.TIMESTAMP }}.tar

      # 4. Upload the folder as a GitHub artifact so it can be downloaded
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: trade-store-image-${{ env.TIMESTAMP }}
          path: docker-builds/
          retention-days: 7 # Optional: Auto-delete after 7 days to save storage